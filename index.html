<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ហាងបញ្ចូលហ្គេម និងសេវាកម្ម - KHQR Payment</title>
    <!-- Library សម្រាប់បង្កើត QR Code -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Kantumruy Pro', sans-serif, Arial;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #1e293b;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #f59e0b;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
        }
        
        /* Game Selector Grid ជាមួយរូបភាព */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .game-card {
            background: #334155;
            padding: 10px 5px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            font-size: 11px;
            font-weight: bold;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .game-card img {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            margin-bottom: 6px;
            object-fit: cover;
        }
        .game-card.active {
            border-color: #f59e0b;
            background: #0f172a;
            color: #f59e0b;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #334155;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #f59e0b;
            color: #000;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .card {
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        .card:hover, .card.active {
            border-color: #f59e0b;
            background: #0f172a;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #f59e0b;
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover {
            background: #d97706;
        }
        
        /* Popup QR Code */
        .qr-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
        }
        .qr-content {
            background: #ffffff;
            color: #0f172a;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            max-width: 360px;
            width: 90%;
        }
        canvas {
            margin: 15px 0;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 5px;
        }
        .loader-box {
            background: #f1f5f9;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 13px;
            color: #0284c7;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>បញ្ចូល ហ្គេម & សេវាកម្ម</h2>

    <!-- ១. ជ្រើសរើសហ្គេម (មានរូបភាព Logo) -->
    <div class="form-group">
        <label>១. ជ្រើសរើសហ្គេម</label>
        <div class="game-grid">
            <div class="game-card active" onclick="selectGame('ff', this)">
                <img src="https://cdn-icons-png.flaticon.com/512/825/825590.png" alt="Free Fire">
                Free Fire
            </div>
            <div class="game-card" onclick="selectGame('mlbb', this)">
                <img src="https://m.mobilelegends.com/static/images/mlbb_logo.png" alt="Mobile Legends">
                Mobile Legends
            </div>
            <div class="game-card" onclick="selectGame('pubg', this)">
                <img src="https://www.pubgmobile.com/images/event/common/logo.png" alt="PUBG Mobile">
                PUBG Mobile
            </div>
            <div class="game-card" onclick="selectGame('rov', this)">
                <img src="https://images.seeklogo.com/logo-png/33/2/arena-of-valor-logo-png_seeklogo-335804.png" alt="ROV">
                ROV
            </div>
        </div>
    </div>

    <!-- ២. បញ្ចូល Player ID -->
    <div class="form-group">
        <label for="playerId">២. បញ្ចូល Player ID</label>
        <input type="text" id="playerId" placeholder="បញ្ចូល ID អ្នកលេង (ឧទាហរណ៍: 123456789)">
    </div>

    <!-- ៣. ជ្រើសរើសកញ្ចប់ -->
    <div class="form-group">
        <label>៣. ជ្រើសរើសកញ្ចប់សេវាកម្ម</label>

        <!-- Dynamic Container សម្រាប់ប្រភេទ និងកញ្ចប់តាមហ្គេម -->
        <div id="packageContainer"></div>
    </div>

    <button class="btn" onclick="generatePayment()">ទូទាត់ប្រាក់ឥឡូវនេះ</button>
</div>

<!-- Modal បង្ហាញ QR Code -->
<div class="qr-modal" id="qrModal">
    <div class="qr-content">
        <h3 style="margin:0; color:#0f172a;">Bakong KHQR Payment</h3>
        <p style="margin: 5px 0; font-size: 14px; font-weight: bold; color: #475569;">SAMNANG MON</p>
        <p id="orderSummary" style="font-size:13px; color:#64748b; margin: 5px 0;"></p>
        
        <canvas id="qrcodeCanvas"></canvas>
        
        <div class="loader-box">
            ⏳ ប្រព័ន្ធកំពុងផ្ទៀងផ្ទាត់ការទូទាត់ប្រាក់...<br>
            <span style="font-size:11px; font-weight:normal; color:#64748b;">(ទំនិញនឹងចូល Account ដោយស្វ័យប្រវត្តិក្នងរយៈពេល 1-3 នាទី បន្ទាប់ពីស្កេនរួច)</span>
        </div>

        <button onclick="closeModal()" style="margin-top:15px; border:none; background:#e2e8f0; padding:8px 20px; border-radius:6px; color:#334155; font-weight:bold; cursor:pointer;">បិទ</button>
    </div>
</div>

<script>
    const BAKONG_ACCOUNT_ID = "samnang_mon@bkrt"; 
    const ACCOUNT_NAME = "SAMNANG MON";

    let currentGame = 'ff';
    let selectedPackage = null;
    let selectedPrice = 0;

    const gameData = {
        ff: {
            tabs: [
                { name: '💎 ពេជ្ររាយ', id: 'ff_diamonds' },
                { name: '👑 កាតសមាជិក', id: 'ff_membership' }
            ],
            packages: {
                ff_diamonds: [
                    { name: '💎 100 ពេជ្រ', price: 0.99 },
                    { name: '💎 310 ពេជ្រ', price: 2.99 },
                    { name: '💎 520 ពេជ្រ', price: 4.99 },
                    { name: '💎 1060 ពេជ្រ', price: 9.99 }
                ],
                ff_membership: [
                    { name: '📅 កាតប្រចាំសប្តាហ៍', price: 3.50 },
                    { name: '📆 កាតប្រចាំខែ', price: 15.00 },
                    { name: '🔫 EVO Gun Pass', price: 4.50 },
                    { name: '⬆️ Level Up Pass', price: 8.00 }
                ]
            }
        },
        mlbb: {
            tabs: [
                { name: '💎 Diamonds', id: 'ml_diamonds' },
                { name: '🌟 Weekly Pass', id: 'ml_pass' }
            ],
            packages: {
                ml_diamonds: [
                    { name: '💎 86 Diamonds', price: 1.50 },
                    { name: '💎 172 Diamonds', price: 3.00 },
                    { name: '💎 257 Diamonds', price: 4.50 },
                    { name: '💎 706 Diamonds', price: 11.50 }
                ],
                ml_pass: [
                    { name: '🌟 Weekly Diamond Pass (1X)', price: 2.20 },
                    { name: '🌟 Weekly Diamond Pass (2X)', price: 4.30 },
                    { name: '🌟 Weekly Diamond Pass (3X)', price: 6.40 },
                    { name: '🌟 Weekly Diamond Pass (5X)', price: 10.50 }
                ]
            }
        },
        pubg: {
            tabs: [
                { name: '💵 UC', id: 'pubg_uc' }
            ],
            packages: {
                pubg_uc: [
                    { name: '💵 60 UC', price: 0.99 },
                    { name: '💵 325 UC', price: 4.99 },
                    { name: '💵 660 UC', price: 9.99 },
                    { name: '💵 1800 UC', price: 24.99 }
                ]
            }
        },
        rov: {
            tabs: [
                { name: '🎟️ Coupons', id: 'rov_coupons' }
            ],
            packages: {
                rov_coupons: [
                    { name: '🎟️ 35 Coupons', price: 1.00 },
                    { name: '🎟️ 175 Coupons', price: 5.00 },
                    { name: '🎟️ 350 Coupons', price: 10.00 },
                    { name: '🎟️ 700 Coupons', price: 20.00 }
                ]
            }
        }
    };

    function selectGame(gameKey, element) {
        document.querySelectorAll('.game-card').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        currentGame = gameKey;
        selectedPackage = null;
        selectedPrice = 0;

        renderPackages();
    }

    function renderPackages() {
        const data = gameData[currentGame];
        const container = document.getElementById('packageContainer');
        container.innerHTML = '';

        if (data.tabs.length > 1) {
            const tabsDiv = document.createElement('div');
            tabsDiv.className = 'tabs';
            data.tabs.forEach((tab, index) => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
                btn.innerText = tab.name;
                btn.onclick = () => switchTab(tab.id, btn);
                tabsDiv.appendChild(btn);
            });
            container.appendChild(tabsDiv);
        }

        data.tabs.forEach((tab, index) => {
            const gridDiv = document.createElement('div');
            gridDiv.className = 'grid';
            gridDiv.id = tab.id;
            gridDiv.style.display = index === 0 ? 'grid' : 'none';

            data.packages[tab.id].forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `${item.name}<br><small>$${item.price.toFixed(2)}</small>`;
                card.onclick = () => selectItem(card, item.name, item.price);
                gridDiv.appendChild(card);
            });

            container.appendChild(gridDiv);
        });
    }

    function switchTab(tabId, btnElement) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        document.querySelectorAll('#packageContainer .grid').forEach(grid => {
            grid.style.display = 'none';
        });
        document.getElementById(tabId).style.display = 'grid';

        document.querySelectorAll('.card').forEach(card => card.classList.remove('active'));
        selectedPackage = null;
        selectedPrice = 0;
    }

    function selectItem(element, packageName, price) {
        document.querySelectorAll('.card').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        selectedPackage = packageName;
        selectedPrice = price;
    }

    function crc16(data) {
        let crc = 0xFFFF;
        for (let i = 0; i < data.length; i++) {
            crc ^= data.charCodeAt(i) << 8;
            for (let j = 0; j < 8; j++) {
                if ((crc & 0x8000) !== 0) {
                    crc = (crc << 1) ^ 0x1021;
                } else {
                    crc = crc << 1;
                }
            }
        }
        crc = crc & 0xFFFF;
        return crc.toString(16).toUpperCase().padStart(4, '0');
    }

    function generateKHQRString(bakongId, merchantName, amount) {
        const formattedAmount = parseFloat(amount).toFixed(2);
        const accountStr = `00${bakongId.length.toString().padStart(2, '0')}${bakongId}`;
        const tag29 = `29${accountStr.length.toString().padStart(2, '0')}${accountStr}`;
        const currencyTag = "5303840";
        const amountTag = `54${formattedAmount.length.toString().padStart(2, '0')}${formattedAmount}`;
        
        const payload = 
            "000201" +
            "010212" +
            tag29 +
            "52045999" +
            currencyTag +
            amountTag +
            "5802KH" +
            `59${merchantName.length.toString().padStart(2, '0')}${merchantName}` +
            "6010Phnom Penh" +
            "6304";

        const crc = crc16(payload);
        return payload + crc;
    }

    function generatePayment() {
        const playerId = document.getElementById('playerId').value;

        if (!playerId) {
            alert('សូមបញ្ចូល Player ID!');
            return;
        }
        if (!selectedPackage) {
            alert('សូមជ្រើសរើសកញ្ចប់សេវាកម្ម!');
            return;
        }

        document.getElementById('orderSummary').innerText = `ID: ${playerId} | ${selectedPackage} | $${selectedPrice.toFixed(2)}`;

        const emvKhqrString = generateKHQRString(BAKONG_ACCOUNT_ID, ACCOUNT_NAME, selectedPrice);

        QRCode.toCanvas(document.getElementById('qrcodeCanvas'), emvKhqrString, { width: 220 }, function (error) {
            if (error) console.error(error);
        });

        document.getElementById('qrModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('qrModal').style.display = 'none';
    }

    renderPackages();
</script>

</body>
</html>
