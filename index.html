<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhmerSMM - Login & Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            padding: 30px 25px;
        }
        .auth-title {
            text-align: center;
            font-weight: bold;
            color: #0d6efd;
            margin-bottom: 25px;
        }
        .nav-pills .nav-link {
            color: #555;
            font-weight: 600;
            border-radius: 8px;
        }
        .nav-pills .nav-link.active {
            background-color: #0d6efd;
            color: #fff;
        }
        .form-label {
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }
        .form-control {
            border-radius: 8px;
            padding: 10px 12px;
        }
        .btn-submit {
            background-color: #0d6efd;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            padding: 12px;
            width: 100%;
            border: none;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #0b5ed7;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <h3 class="auth-title"><i class="fa-solid fa-rocket me-2"></i>KhmerSMM</h3>

    <ul class="nav nav-pills nav-justified mb-4" id="pills-tab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="tab-login-btn" onclick="switchForm('login')">Sign In</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="tab-register-btn" onclick="switchForm('register')">Sign Up</button>
        </li>
    </ul>

    <div id="login-form">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" id="login-username" class="form-control" placeholder="បញ្ចូល Username">
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="login-password" class="form-control" placeholder="បញ្ចូល Password">
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label text-muted fs-6" for="rememberMe">Remember me</label>
            </div>
            <a href="#" class="text-primary text-decoration-none fs-6">Forgot password?</a>
        </div>
        <button class="btn-submit" onclick="submitLogin()">Sign In</button>
    </div>

    <div id="register-form" style="display: none;">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" id="reg-username" class="form-control" placeholder="បង្កើត Username">
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="reg-email" class="form-control" placeholder="name@example.com">
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="reg-password" class="form-control" placeholder="បង្កើត Password">
        </div>
        <button class="btn-submit" onclick="submitRegister()">Sign Up</button>
    </div>
</div>

<script>
    function switchForm(type) {
        if (type === 'login') {
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('register-form').style.display = 'none';
            document.getElementById('tab-login-btn').classList.add('active');
            document.getElementById('tab-register-btn').classList.remove('active');
        } else {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('register-form').style.display = 'block';
            document.getElementById('tab-register-btn').classList.add('active');
            document.getElementById('tab-login-btn').classList.remove('active');
        }
    }

    async function submitLogin() {
        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;

        if (!username || !password) {
            alert('សូមបញ្ចូល Username និង Password!');
            return;
        }

        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        alert(data.message);
    }

    async function submitRegister() {
        const username = document.getElementById('reg-username').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;

        if (!username || !email || !password) {
            alert('សូមបំពេញព័ត៌មានឱ្យបានគ្រប់ជ្រុងជ្រោយ!');
            return;
        }

        const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password })
        });

        const data = await res.json();
        alert(data.message);
        if (data.success) switchForm('login');
    }
</script>

</body>
</html>
