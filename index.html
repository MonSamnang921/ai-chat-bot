<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhmerSMM - Register</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; }
        input, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="card">
    <h2>ចុះឈ្មោះគណនីថ្មី</h2>
    <form id="registerForm">
        <input type="text" id="username" placeholder="ឈ្មោះ (Full Name)" required>
        <input type="email" id="email" placeholder="អ៊ីម៉ែល (Email)" required>
        <button type="submit">ចុះឈ្មោះ (Register)</button>
    </form>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const name = document.getElementById('username').value;
        const email = document.getElementById('email').value;

        // បាញ់ទិន្នន័យទៅ backend API
        fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, email: email })
        })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                alert("ចុះឈ្មោះជោគជ័យ! ទិន្នន័យត្រូវបានបញ្ជូនទៅ Admin Panel រួចរាល់។");
                document.getElementById('registerForm').reset();
            } else {
                alert("មានបញ្ហា៖ " + data.message);
            }
        })
        .catch(err => {
            console.error("Error:", err);
            alert("មិនអាចភ្ជាប់ទៅកាន់ Server បានទេ!");
        });
    });
</script>

</body>
</html>
