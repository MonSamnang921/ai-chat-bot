<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhmerSMM - សេវាកម្មបណ្តាញសង្គម</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2d2d2d;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #3d3d3d;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0d1b3e;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #162a5e;
        }
        #qr-container {
            margin-top: 20px;
            display: none;
        }
        #qr-image {
            width: 250px;
            height: 250px;
            margin: 15px auto;
            border-radius: 8px;
            background: #fff;
            padding: 10px;
        }
        .loading {
            display: none;
            margin-top: 15px;
            color: #ccc;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-group">
        <label>ជ្រើសរើសសេវាកម្ម</label>
        <select id="service">
            <option value="1.00">1,000 Facebook Likes - $1.00</option>
            <option value="5.00">2,000 TikTok Followers - $5.00</option>
            <option value="10.00">5,000 YouTube Views - $10.00</option>
        </select>
    </div>

    <div class="form-group">
        <label>Link គណនី/វីដេអូ</label>
        <input type="text" id="link" placeholder="https://..." required>
    </div>

    <button id="btn-pay" onclick="generateQR()">ទូទាត់ប្រាក់តាម KHQR</button>

    <div id="loading" class="loading">កំពុងបង្កើត KHQR...</div>

    <div id="qr-container">
        <h3>ស្កែនដើម្បីទូទាត់ប្រាក់</h3>
        <img id="qr-image" src="" alt="KHQR Code">
    </div>
</div>

<script>
    async function generateQR() {
        const serviceSelect = document.getElementById('service');
        const amount = serviceSelect.value;
        const serviceText = serviceSelect.options[serviceSelect.selectedIndex].text;
        const link = document.getElementById('link').value;

        if (!link) {
            alert('សូមបញ្ចូល Link គណនី/វីដេអូ ជាមុនសិន!');
            return;
        }

        document.getElementById('loading').style.display = 'block';
        document.getElementById('qr-container').style.display = 'none';

        try {
            const response = await fetch('/generate-qr', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    amount: amount,
                    service: serviceText
                })
            });

            const data = await response.json();
            document.getElementById('loading').style.display = 'none';

            if (data.success && data.qrImage) {
                document.getElementById('qr-image').src = data.qrImage;
                document.getElementById('qr-container').style.display = 'block';
            } else {
                alert(data.message || 'មិនអាចបង្កើត KHQR Code បានទេ');
            }
        } catch (error) {
            document.getElementById('loading').style.display = 'none';
            alert('មានបញ្ហាក្នុងការភ្ជាប់ទៅកាន់ Server!');
        }
    }
</script>

</body>
</html>
