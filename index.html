<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KHMER SMM Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: #f4f6f9; }
        .hidden { display: none; }
    </style>
</head>
<body>

<!-- 1. ទំព័រ LOGIN -->
<div id="loginSection" class="d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 text-center shadow-sm" style="width: 380px;">
        <h3 class="fw-bold mb-3">KHMER SMM</h3>
        <p class="text-muted mb-4">ចុចខាងក្រោមដើម្បីចូលប្រើប្រាស់</p>
        <div id="g_id_onload"
             data-client_id="781995105719-0no5v9433h4ce49gatkua0gposrc3e51.apps.googleusercontent.com"
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin d-flex justify-content-center" data-type="standard" data-size="large"></div>
    </div>
</div>

<!-- 2. ទំព័រ DASHBOARD SMM -->
<div id="dashboardSection" class="hidden">
    <nav class="navbar navbar-dark bg-primary px-4">
        <span class="navbar-brand fw-bold">KHMER SMM</span>
        <div class="d-flex align-items-center gap-3">
            <span id="userInfo" class="text-white"></span>
            <button class="btn btn-sm btn-light" onclick="location.reload()">ចាកចេញ</button>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row">
            <!-- Order Form -->
            <div class="col-md-7 mb-4">
                <div class="card p-4 shadow-sm">
                    <h5 class="fw-bold mb-3">បង្កើតការកុម្ម៉ង់ (New Order)</h5>
                    <form id="orderForm">
                        <div class="mb-3">
                            <label class="form-label">ជ្រើសរើសសេវាកម្ម</label>
                            <select class="form-select" id="serviceSelect" required></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">តំណភ្ជាប់ (Link)</label>
                            <input type="url" class="form-control" id="orderLink" placeholder="https://..." required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">ចំនួន (Quantity)</label>
                            <input type="number" class="form-control" id="orderQty" value="1000" min="100" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">បញ្ជូនការកុម្ម៉ង់</button>
                    </form>
                </div>
            </div>

            <!-- Deposit KHQR Form -->
            <div class="col-md-5">
                <div class="card p-4 shadow-sm text-center">
                    <h5 class="fw-bold mb-3">បញ្ចូលប្រាក់ (Add Funds KHQR)</h5>
                    <input type="number" class="form-control mb-3" id="depositAmount" placeholder="ចំនួនទឹកប្រាក់ ($)" value="5">
                    <button class="btn btn-success w-100 mb-3" onclick="generateQR()">បង្កើត KHQR</button>
                    
                    <div id="qrArea" class="hidden">
                        <canvas id="qrCanvas" class="mb-2"></canvas>
                        <p class="text-muted small">ស្កែនតាមរយៈ App ធនាគារណាក៏បាន (Bakong ID: mon_samnang@bkrt)</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. Google Login Handler
    function handleCredentialResponse(response) {
        fetch('/api/auth/google', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: response.credential })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                document.getElementById('userInfo').innerText = 'ស្វាគមន៍, ' + data.user.name;
                loadServices();
            }
        });
    }

    // 2. Load Services from KhmerSmm API
    function loadServices() {
        fetch('/api/services')
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                const select = document.getElementById('serviceSelect');
                select.innerHTML = '';
                data.services.forEach(s => {
                    select.innerHTML += `<option value="${s.service}">${s.name} - $${s.rate}/1000</option>`;
                });
            }
        });
    }

    // 3. Submit Order
    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();
        fetch('/api/order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                serviceId: document.getElementById('serviceSelect').value,
                link: document.getElementById('orderLink').value,
                quantity: document.getElementById('orderQty').value
            })
        })
        .then(res => res.json())
        .then(data => alert('កុម្ម៉ង់ជោគជ័យ! Order ID: ' + (data.data.order || 'N/A')));
    });

    // 4. Generate Bakong KHQR Code
    function generateQR() {
        const amount = document.getElementById('depositAmount').value;
        fetch('/api/generate-khqr', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount: amount, orderId: Date.now() })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                document.getElementById('qrArea').classList.remove('hidden');
                QRCode.toCanvas(document.getElementById('qrCanvas'), data.qrString, { width: 220 });
            }
        });
    }
</script>

</body>
</html>
