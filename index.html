<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUTH STORE - ហាងបញ្ចូលហ្គេម និងសេវាកម្ម</title>
    <!-- Library សម្រាប់បង្កើត QR Code -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <!-- FontAwesome Icon សម្រាប់ Logo ហ្គេម -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Identity Services (Sign in with Google) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Kantumruy Pro', sans-serif, Arial;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #1e293b;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #f59e0b;
            margin-bottom: 20px;
        }
        
        /* ផ្នែក Login Google */
        .login-box {
            text-align: center;
            padding: 30px 10px;
        }
        .login-box i {
            font-size: 50px;
            color: #f59e0b;
            margin-bottom: 15px;
        }
        .user-profile {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-info img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
        }
        .logout-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
        }
        
        /* Game Selector Grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .game-card {
            background: #334155;
            padding: 14px 6px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            font-size: 11px;
            font-weight: bold;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .game-icon-box {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        .icon-ff { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        .icon-ml { background: linear-gradient(135deg, #8a2387, #e94057, #f27121); }
        .icon-pubg { background: linear-gradient(135deg, #f7971e, #ffd200); color: #000 !important; }
        .icon-rov { background: linear-gradient(135deg, #11998e, #38ef7d); color: #000 !important; }

        .game-card.active {
            border-color: #f59e0b;
            background: #0f172a;
            color: #f59e0b;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #334155;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #f59e0b;
            color: #000;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .card {
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        .card:hover, .card.active {
            border-color: #f59e0b;
            background: #0f172a;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #f59e0b;
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover {
            background: #d97706;
        }
        
        /* Popup QR Code Modal */
        .qr-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* KHQR Card Template Styling ដូចរូបភាព Bakong ផ្លូវការ */
        .khqr-card {
            background: #ffffff;
            color: #000000;
            border-radius: 16px;
            width: 320px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }
        .khqr-header {
            background: #e11d48;
            padding: 12px 0;
            text-align: center;
            position: relative;
        }
        .khqr-header-title {
            color: #ffffff;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .khqr-body {
            padding: 20px 24px;
        }
        .khqr-merchant {
            font-size: 16px;
            color: #1e293b;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .khqr-amount {
            font-size: 26px;
            font-weight: 800;
            color: #000000;
            margin-bottom: 12px;
        }
        .khqr-amount span {
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
        }
        .khqr-divider {
            border-top: 2px dashed #cbd5e1;
            margin: 12px 0 16px 0;
        }
        .khqr-qr-box {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            width: 230px !important;
            height: 230px !important;
        }
        .loader-box {
            background: #f1f5f9;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 12px;
            color: #0284c7;
            font-weight: bold;
            text-align: center;
        }
        .btn-close-modal {
            width: 100%;
            margin-top: 12px;
            border: none;
            background: #e2e8f0;
            padding: 10px;
            border-radius: 8px;
            color: #334155;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>YUTH STORE - បញ្ចូលហ្គេម</h2>

    <!-- ជំហានទី ០៖ ផ្ទាំង Login ជាមួយ Google (បង្ហាញមុនគេ) -->
    <div id="loginSection" class="login-box">
        <i class="fa-solid fa-user-lock"></i>
        <h3 style="margin-top:0;">សូមចូលប្រើប្រាស់មុននឹងទិញ</h3>
        <p style="color:#94a3b8; font-size:14px; margin-bottom:20px;">សូម ចុះឈ្មោះ/Login តាមរយៈ Google ដើម្បីបន្តការបញ្ជាទិញ</p>
        
        <div style="display: flex; justify-content: center;">
            <div id="g_id_onload"
                data-client_id="781995105719-0no5v9433h4ce49gatkua0gposrc3e51.apps.googleusercontent.com"
                data-callback="handleCredentialResponse">
            </div>
            <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with"></div>
        </div>
    </div>

    <!-- ផ្ទាំងទិញពេជ្រ (លាក់ទុក រង់ចាំ Login រួច) -->
    <div id="shopSection" style="display: none;">
        
        <div class="user-profile">
            <div class="user-info">
                <img id="userImg" src="" alt="Profile">
                <div>
                    <div id="userName" style="font-weight:bold; font-size:14px;"></div>
                    <div id="userEmail" style="font-size:11px; color:#94a3b8;"></div>
                </div>
            </div>
            <button class="logout-btn" onclick="logout()">ចាកចេញ</button>
        </div>

        <!-- ១. ជ្រើសរើសហ្គេម -->
        <div class="form-group">
            <label>១. ជ្រើសរើសហ្គេម</label>
            <div class="game-grid">
                <div class="game-card active" onclick="selectGame('ff', this)">
                    <div class="game-icon-box icon-ff"><i class="fa-solid fa-fire"></i></div>
                    Free Fire
                </div>
                <div class="game-card" onclick="selectGame('mlbb', this)">
                    <div class="game-icon-box icon-ml"><i class="fa-solid fa-shield-halved"></i></div>
                    MLBB
                </div>
                <div class="game-card" onclick="selectGame('pubg', this)">
                    <div class="game-icon-box icon-pubg"><i class="fa-solid fa-crosshairs"></i></div>
                    PUBG
                </div>
                <div class="game-card" onclick="selectGame('rov', this)">
                    <div class="game-icon-box icon-rov"><i class="fa-solid fa-crown"></i></div>
                    ROV
                </div>
            </div>
        </div>

        <!-- ២. បញ្ចូល Player ID -->
        <div class="form-group">
            <label for="playerId">២. បញ្ចូល Player ID</label>
            <input type="text" id="playerId" placeholder="បញ្ចូល ID អ្នកលេង (ឧទាហរណ៍: 123456789)">
        </div>

        <!-- ៣. ជ្រើសរើសកញ្ចប់ -->
        <div class="form-group">
            <label>៣. ជ្រើសរើសកញ្ចប់សេវាកម្ម</label>
            <div id="packageContainer"></div>
        </div>

        <button class="btn" onclick="generatePayment()">ទូទាត់ប្រាក់ឥឡូវនេះ</button>
    </div>
</div>

<!-- Modal បង្ហាញ KHQR Form -->
<div class="qr-modal" id="qrModal">
    <div class="khqr-card">
        <!-- Header KHQR ក្រហម -->
        <div class="khqr-header">
            <h1 class="khqr-header-title">KHQR</h1>
        </div>

        <!-- Body បង្ហាញព័ត៌មាន KHQR -->
        <div class="khqr-body">
            <div class="khqr-merchant">YUTH STORE</div>
            <div class="khqr-amount" id="displayAmount">0.00 <span>USD</span></div>

            <div class="khqr-divider"></div>

            <!-- កន្លែង QR Code -->
            <div class="khqr-qr-box">
                <canvas id="qrcodeCanvas"></canvas>
            </div>

            <div class="loader-box">
                ⏳ ប្រព័ន្ធកំពុងផ្ទៀងផ្ទាត់ការទូទាត់ប្រាក់...
            </div>

            <button class="btn-close-modal" onclick="closeModal()">បិទ</button>
        </div>
    </div>
</div>

<script>
    const BAKONG_ACCOUNT_ID = "samnang_mon@bkrt"; 
    const ACCOUNT_NAME = "YUTH STORE";

    let currentUser = null;
    let currentGame = 'ff';
    let selectedPackage = null;
    let selectedPrice = 0;

    function parseJwt (token) {
        var base64Url = token.split('.')[1];
        var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
    }

    function handleCredentialResponse(response) {
        const responsePayload = parseJwt(response.credential);
        currentUser = responsePayload;

        document.getElementById('userName').innerText = responsePayload.name;
        document.getElementById('userEmail').innerText = responsePayload.email;
        document.getElementById('userImg').src = responsePayload.picture;

        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('shopSection').style.display = 'block';
    }

    function logout() {
        currentUser = null;
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('shopSection').style.display = 'none';
    }

    const gameData = {
        ff: {
            tabs: [
                { name: '💎 ពេជ្ររាយ', id: 'ff_diamonds' },
                { name: '👑 កាតសមាជិក', id: 'ff_membership' }
            ],
            packages: {
                ff_diamonds: [
                    { name: '💎 100 ពេជ្រ', price: 0.99 },
                    { name: '💎 310 ពេជ្រ', price: 2.99 },
                    { name: '💎 520 ពេជ្រ', price: 4.99 },
                    { name: '💎 1060 ពេជ្រ', price: 9.99 }
                ],
                ff_membership: [
                    { name: '📅 កាតប្រចាំសប្តាហ៍', price: 3.50 },
                    { name: '📆 កាតប្រចាំខែ', price: 15.00 },
                    { name: '🔫 EVO Gun Pass', price: 4.50 },
                    { name: '⬆️ Level Up Pass', price: 8.00 }
                ]
            }
        },
        mlbb: {
            tabs: [
                { name: '💎 Diamonds', id: 'ml_diamonds' },
                { name: '🌟 Weekly Pass', id: 'ml_pass' }
            ],
            packages: {
                ml_diamonds: [
                    { name: '💎 86 Diamonds', price: 1.50 },
                    { name: '💎 172 Diamonds', price: 3.00 },
                    { name: '💎 257 Diamonds', price: 4.50 },
                    { name: '💎 706 Diamonds', price: 11.50 }
                ],
                ml_pass: [
                    { name: '🌟 Weekly Diamond Pass (1X)', price: 2.20 },
                    { name: '🌟 Weekly Diamond Pass (2X)', price: 4.30 },
                    { name: '🌟 Weekly Diamond Pass (3X)', price: 6.40 },
                    { name: '🌟 Weekly Diamond Pass (5X)', price: 10.50 }
                ]
            }
        },
        pubg: {
            tabs: [
                { name: '💵 UC', id: 'pubg_uc' }
            ],
            packages: {
                pubg_uc: [
                    { name: '💵 60 UC', price: 0.99 },
                    { name: '💵 325 UC', price: 4.99 },
                    { name: '💵 660 UC', price: 9.99 },
                    { name: '💵 1800 UC', price: 24.99 }
                ]
            }
        },
        rov: {
            tabs: [
                { name: '🎟️ Coupons', id: 'rov_coupons' }
            ],
            packages: {
                rov_coupons: [
                    { name: '🎟️ 35 Coupons', price: 1.00 },
                    { name: '🎟️ 175 Coupons', price: 5.00 },
                    { name: '🎟️ 350 Coupons', price: 10.00 },
                    { name: '🎟️ 700 Coupons', price: 20.00 }
                ]
            }
        }
    };

    function selectGame(gameKey, element) {
        document.querySelectorAll('.game-card').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        currentGame = gameKey;
        selectedPackage = null;
        selectedPrice = 0;

        renderPackages();
    }

    function renderPackages() {
        const data = gameData[currentGame];
        const container = document.getElementById('packageContainer');
        container.innerHTML = '';

        if (data.tabs.length > 1) {
            const tabsDiv = document.createElement('div');
            tabsDiv.className = 'tabs';
            data.tabs.forEach((tab, index) => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
                btn.innerText = tab.name;
                btn.onclick = () => switchTab(tab.id, btn);
                tabsDiv.appendChild(btn);
            });
            container.appendChild(tabsDiv);
        }

        data.tabs.forEach((tab, index) => {
            const gridDiv = document.createElement('div');
            gridDiv.className = 'grid';
            gridDiv.id = tab.id;
            gridDiv.style.display = index === 0 ? 'grid' : 'none';

            data.packages[tab.id].forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `${item.name}<br><small>$${item.price.toFixed(2)}</small>`;
                card.onclick = () => selectItem(card, item.name, item.price);
                gridDiv.appendChild(card);
            });

            container.appendChild(gridDiv);
        });
    }

    function switchTab(tabId, btnElement) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        document.querySelectorAll('#packageContainer .grid').forEach(grid => {
            grid.style.display = 'none';
        });
        document.getElementById(tabId).style.display = 'grid';

        document.querySelectorAll('.card').forEach(card => card.classList.remove('active'));
        selectedPackage = null;
        selectedPrice = 0;
    }

    function selectItem(element, packageName, price) {
        document.querySelectorAll('.card').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        selectedPackage = packageName;
        selectedPrice = price;
    }

    function crc16(data) {
        let crc = 0xFFFF;
        for (let i = 0; i < data.length; i++) {
            crc ^= data.charCodeAt(i) << 8;
            for (let j = 0; j < 8; j++) {
                if ((crc & 0x8000) !== 0) {
                    crc = (crc << 1) ^ 0x1021;
                } else {
                    crc = crc << 1;
                }
            }
        }
        crc = crc & 0xFFFF;
        return crc.toString(16).toUpperCase().padStart(4, '0');
    }

    function generateKHQRString(bakongId, merchantName, amount) {
        const formattedAmount = parseFloat(amount).toFixed(2);
        const accountStr = `00${bakongId.length.toString().padStart(2, '0')}${bakongId}`;
        const tag29 = `29${accountStr.length.toString().padStart(2, '0')}${accountStr}`;
        const currencyTag = "5303840";
        const amountTag = `54${formattedAmount.length.toString().padStart(2, '0')}${formattedAmount}`;
        
        const payload = 
            "000201" +
            "010212" +
            tag29 +
            "52045999" +
            currencyTag +
            amountTag +
            "5802KH" +
            `59${merchantName.length.toString().padStart(2, '0')}${merchantName}` +
            "6010Phnom Penh" +
            "6304";

        const crc = crc16(payload);
        return payload + crc;
    }

    function generatePayment() {
        const playerId = document.getElementById('playerId').value;

        if (!playerId) {
            alert('សូមបញ្ចូល Player ID!');
            return;
        }
        if (!selectedPackage) {
            alert('សូមជ្រើសរើសកញ្ចប់សេវាកម្ម!');
            return;
        }

        document.getElementById('displayAmount').innerHTML = `${selectedPrice.toFixed(2)} <span>USD</span>`;

        const emvKhqrString = generateKHQRString(BAKONG_ACCOUNT_ID, ACCOUNT_NAME, selectedPrice);

        QRCode.toCanvas(document.getElementById('qrcodeCanvas'), emvKhqrString, { width: 230 }, function (error) {
            if (error) console.error(error);
        });

        document.getElementById('qrModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('qrModal').style.display = 'none';
    }

    renderPackages();
</script>

</body>
</html>
