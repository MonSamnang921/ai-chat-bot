<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KhmerSMM - Web Service</title>
  <!-- Google Sign-In SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f6f9;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      width: 320px;
    }
    h2 {
      margin-bottom: 20px;
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #ddd;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background: #0369a1; }
    .user-info { margin-top: 20px; display: none; }
    .profile-img { width: 80px; height: 80px; border-radius: 50%; margin-bottom: 10px; }
    .divider { margin: 15px 0; color: #888; font-size: 14px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>KhmerSMM</h2>
    
    <!-- Sign Up Form -->
    <div id="authForm">
      <input type="text" id="username" placeholder="Username">
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password">
      <button onclick="handleSignUp()">Sign Up</button>
      
      <div class="divider">or</div>

      <!-- Google Sign-In Button Config -->
      <div id="g_id_onload"
           data-client_id="781995105719-0no5v9433h4ce49gatkua0gposrc3e51.apps.googleusercontent.com"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>

      <div class="g_id_signin"
           data-type="standard"
           data-size="large"
           data-theme="outline"
           data-text="continue_with"
           data-shape="rectangular"
           data-logo_alignment="left">
      </div>
    </div>

    <!-- ផ្នែកបង្ហាញព័ត៌មាន User ពេល Login រួច -->
    <div id="userInfo" class="user-info">
      <img id="userImg" class="profile-img" src="" alt="Profile">
      <h3 id="userName"></h3>
      <p id="userEmail"></p>
      <p><b>Balance:</b> $<span id="userBalance">0.00</span></p>
    </div>
  </div>

  <script>
    // មុខងារ Sign Up ធម្មតា
    async function handleSignUp() {
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!username || !email || !password) {
        alert('សូមបំពេញព័ត៌មានទាំងអស់!');
        return;
      }

      try {
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();

        if (data.success) {
          alert('🎉 ' + data.message);
          showUserSession(data.user.username, data.user.email, '', data.user.balance);
        } else {
          alert('❌ ' + data.message);
        }
      } catch (err) {
        alert('❌ មានបញ្ហាភ្ជាប់ទៅ Server!');
      }
    }

    // មុខងារ Google Sign-In Callback
    async function handleCredentialResponse(response) {
      const data = parseJwt(response.credential);
      
      try {
        const res = await fetch('/api/google-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: data.email,
            name: data.name,
            googleId: data.sub
          })
        });
        const result = await res.json();
        if (result.success) {
          alert('🎉 Google Login ជោគជ័យ!');
          showUserSession(result.user.username, result.user.email, data.picture, result.user.balance);
        }
      } catch (err) {
        alert('❌ Google Login បរាជ័យ!');
      }
    }

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function showUserSession(name, email, imgUrl, balance) {
      document.getElementById('authForm').style.display = 'none';
      document.getElementById('userName').innerText = name;
      document.getElementById('userEmail').innerText = email;
      document.getElementById('userBalance').innerText = balance.toFixed(2);
      if(imgUrl) document.getElementById('userImg').src = imgUrl;
      document.getElementById('userInfo').style.display = 'block';
    }
  </script>

</body>
</html>
