<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhmerSMM - Login & Order Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh; padding: 20px 10px; }
        .auth-card, .app-container { max-width: 440px; margin: 20px auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 25px; }
        .btn-submit { background-color: #0d6efd; color: #fff; font-weight: bold; border-radius: 8px; width: 100%; padding: 12px; border: none; }
        .btn-submit:hover { background-color: #0b5ed7; }
        .nav-pills .nav-link { color: #555; font-weight: 600; border-radius: 8px; }
        .nav-pills .nav-link.active { background-color: #0d6efd; color: #fff; }
        
        /* Dashboard Styling */
        #dashboard-section { display: none; }
        .balance-box { background: #eef5ff; color: #0d6efd; font-weight: bold; text-align: center; padding: 10px; border-radius: 8px; margin-bottom: 15px; }
        .platform-btn { border: 1px solid #0d6efd; color: #0d6efd; background: #fff; border-radius: 8px; padding: 10px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; }
        .platform-btn:hover { background: #0d6efd; color: #fff; }
        
        /* KHQR Styling */
        .khqr-card { display: none; width: 280px; background: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.2); margin: 20px auto 0 auto; border: 1px solid #e0e0e0; color: #000; text-align: center; }
        .khqr-header { background-color: #E11919; padding: 10px 18px; color: #fff; font-weight: 800; font-size: 20px; text-align: left; }
        .qr-wrapper { position: relative; width: 180px; height: 180px; margin: 10px auto 15px auto; }
        .qr-image { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="auth-section" class="auth-card">
        <h3 class="text-center fw-bold text-primary mb-4"><i class="fa-solid fa-rocket me-2"></i>KhmerSMM</h3>

        <ul class="nav nav-pills nav-justified mb-4">
            <li class="nav-item">
                <button class="nav-link active" id="btn-tab-login" onclick="switchForm('login')">Sign In</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="btn-tab-reg" onclick="switchForm('register')">Sign Up</button>
            </li>
        </ul>

        <div id="login-form">
            <div class="mb-3">
                <label class="form-label fw-bold">Username</label>
                <input type="text" id="login-user" class="form-control" placeholder="បញ្ចូល Username">
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Password</label>
                <input type="password" id="login-pass" class="form-control" placeholder="បញ្ចូល Password">
            </div>
            <button class="btn-submit mb-3" onclick="handleLogin()">Sign In</button>
        </div>

        <div id="register-form" style="display: none;">
            <div class="mb-3">
                <label class="form-label fw-bold">Username</label>
                <input type="text" id="reg-user" class="form-control" placeholder="បង្កើត Username">
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Email</label>
                <input type="email" id="reg-email" class="form-control" placeholder="name@example.com">
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Password</label>
                <input type="password" id="reg-pass" class="form-control" placeholder="បង្កើត Password">
            </div>
            <button class="btn-submit mb-3" onclick="handleRegister()">Sign Up</button>
        </div>
    </div>

    <div id="dashboard-section" class="app-container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0 text-primary"><i class="fa-solid fa-circle-user me-1"></i> KhmerSMM</h5>
            <button class="btn btn-sm btn-outline-danger" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> ចាកចេញ</button>
        </div>

        <div class="balance-box">
            សូមស្វាគមន៍ <b id="user-display">User</b> | Balance: <span class="text-success">$0.00</span>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">ជ្រើសរើសសេវាកម្ម</label>
            <select class="form-select" id="service-select">
                <option value="1.00">17083 - Facebook Followers ($1.00 / 1K)</option>
                <option value="0.20">10611 - TikTok Views ($0.20 / 1K)</option>
                <option value="1.50">14490 - YouTube Views ($1.50 / 1K)</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Link គណនី/វីដេអូ</label>
            <input type="text" class="form-control" id="target-link" placeholder="https://...">
        </div>

        <button class="btn-submit" onclick="generateKHQR()">ទូទាត់ប្រាក់តាម KHQR</button>

        <div id="khqr-card" class="khqr-card p-3">
            <div class="khqr-header">KHQR</div>
            <div class="fw-bold mt-2 fs-5">KhmerSMM</div>
            <h3 class="fw-bold text-success my-1">$<span id="card-amount">1.00</span></h3>
            <div class="qr-wrapper">
                <img id="qr-img" class="qr-image" src="" alt="KHQR">
            </div>
        </div>
    </div>

<script>
    function switchForm(type) {
        if (type === 'login') {
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('register-form').style.display = 'none';
            document.getElementById('btn-tab-login').classList.add('active');
            document.getElementById('btn-tab-reg').classList.remove('active');
        } else {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('register-form').style.display = 'block';
            document.getElementById('btn-tab-reg').classList.add('active');
            document.getElementById('btn-tab-login').classList.remove('active');
        }
    }

    async function handleRegister() {
        const username = document.getElementById('reg-user').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-pass').value;

        if (!username || !email || !password) {
            alert('សូមបំពេញព័ត៌មានឱ្យបានគ្រប់ជ្រុងជ្រោយ!');
            return;
        }

        try {
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });
            const data = await res.json();
            alert(data.message);
            if (data.success) switchForm('login');
        } catch (e) {
            alert('មានបញ្ហាក្នុងការតភ្ជាប់ទៅ Server!');
        }
    }

    async function handleLogin() {
        const username = document.getElementById('login-user').value;
        const password = document.getElementById('login-pass').value;

        if (!username || !password) {
            alert('សូមបញ្ចូល Username និង Password!');
            return;
        }

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('dashboard-section').style.display = 'block';
                document.getElementById('user-display').innerText = data.user.username;
            } else {
                alert(data.message);
            }
        } catch (e) {
            alert('មានបញ្ហាក្នុងការតភ្ជាប់ទៅ Server!');
        }
    }

    function handleLogout() {
        document.getElementById('auth-section').style.display = 'block';
        document.getElementById('dashboard-section').style.display = 'none';
    }

    async function generateKHQR() {
        const link = document.getElementById('target-link').value;
        const amount = document.getElementById('service-select').value;

        if (!link) {
            alert('សូមបញ្ចូល Link ជាមុនសិន!');
            return;
        }

        try {
            const res = await fetch('/generate-qr', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount, service: 'SMM Order' })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('qr-img').src = data.qrImage;
                document.getElementById('card-amount').innerText = parseFloat(amount).toFixed(2);
                document.getElementById('khqr-card').style.display = 'block';
            } else {
                alert(data.message);
            }
        } catch (e) {
            alert('មានបញ្ហាក្នុងការបង្កើត KHQR!');
        }
    }
</script>

</body>
</html>
