<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>បញ្ចូលពេជ្រ Free Fire - KHQR Payment</title>
    <!-- Library សម្រាប់បង្កើត QR Code -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Kantumruy Pro', sans-serif, Arial;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #1e293b;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #f59e0b;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .card {
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        .card:hover, .card.active {
            border-color: #f59e0b;
            background: #0f172a;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #f59e0b;
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover {
            background: #d97706;
        }
        /* Popup QR Code */
        .qr-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
        }
        .qr-content {
            background: #ffffff;
            color: #0f172a;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            max-width: 360px;
            width: 90%;
        }
        .status-loader {
            margin-top: 10px;
            font-size: 14px;
            color: #0284c7;
            font-weight: bold;
        }
        canvas {
            margin: 15px 0;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 5px;
        }
        .btn-telegram {
            background: #0088cc;
            color: #fff;
            text-decoration: none;
            display: block;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>បញ្ចូលពេជ្រ FREE FIRE</h2>

    <!-- ១. បញ្ចូល Player ID -->
    <div class="form-group">
        <label for="playerId">១. បញ្ចូល ID អ្នកលេង (Player ID)</label>
        <input type="text" id="playerId" placeholder="ឧទាហរណ៍: 123456789">
    </div>

    <!-- ២. ជ្រើសរើសចំនួនពេជ្រ -->
    <div class="form-group">
        <label>២. ជ្រើសរើសកញ្ចប់ពេជ្រ</label>
        <div class="grid" id="diamondOptions">
            <div class="card" onclick="selectItem(this, 100, 0.99)">💎 100 ពេជ្រ<br><small>$0.99</small></div>
            <div class="card" onclick="selectItem(this, 310, 2.99)">💎 310 ពេជ្រ<br><small>$2.99</small></div>
            <div class="card" onclick="selectItem(this, 520, 4.99)">💎 520 ពេជ្រ<br><small>$4.99</small></div>
            <div class="card" onclick="selectItem(this, 1060, 9.99)">💎 1060 ពេជ្រ<br><small>$9.99</small></div>
        </div>
    </div>

    <button class="btn" onclick="generatePayment()">ទូទាត់ប្រាក់ឥឡូវនេះ</button>
</div>

<!-- Modal បង្ហាញ QR Code -->
<div class="qr-modal" id="qrModal">
    <div class="qr-content">
        <h3 style="margin:0; color:#0f172a;">Bakong KHQR Payment</h3>
        <p style="margin: 5px 0; font-size: 14px; font-weight: bold; color: #475569;">SAMNANG MON</p>
        <p id="orderSummary" style="font-size:13px; color:#64748b; margin: 5px 0;"></p>
        
        <canvas id="qrcodeCanvas"></canvas>
        
        <div class="status-loader" id="paymentStatus">⏳ កំពុងរង់ចាំការស្កេនទូទាត់...</div>

        <a href="#" id="telegramBtn" target="_blank" class="btn-telegram">ផ្ញើវិក្កយបត្រទៅ Telegram</a>
        <button onclick="closeModal()" style="margin-top:10px; border:none; background:none; color:#64748b; cursor:pointer;">បិទ</button>
    </div>
</div>

<script>
    // ព័ត៌មាន Bakong របស់អ្នក
    const BAKONG_ACCOUNT_ID = "samnang_mon@bkrt"; 
    const ACCOUNT_NAME = "SAMNANG MON";
    const TELEGRAM_USERNAME = "YourTelegramUsername"; // 🔴 ដាក់ Username Telegram របស់អ្នក (គ្មាន @)

    let selectedDiamond = 0;
    let selectedPrice = 0;
    let checkInterval = null;

    function selectItem(element, diamonds, price) {
        document.querySelectorAll('#diamondOptions .card').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        selectedDiamond = diamonds;
        selectedPrice = price;
    }

    function generatePayment() {
        const playerId = document.getElementById('playerId').value;

        if (!playerId) {
            alert('សូមបញ្ចូល Player ID ជាមុនសិន!');
            return;
        }
        if (selectedDiamond === 0) {
            alert('សូមជ្រើសរើសកញ្ចប់ពេជ្រ!');
            return;
        }

        document.getElementById('orderSummary').innerText = `ID: ${playerId} | 💎 ${selectedDiamond} ពេជ្រ | $${selectedPrice}`;

        // DeepLink ទ្រង់ទ្រាយ Bakong សម្រាប់បង្កើត KHQR
        const qrString = `bakong://pay?id=${BAKONG_ACCOUNT_ID}&name=${encodeURIComponent(ACCOUNT_NAME)}&amount=${selectedPrice}&currency=USD`;

        // គូរ QR Code
        QRCode.toCanvas(document.getElementById('qrcodeCanvas'), qrString, { width: 200 }, function (error) {
            if (error) console.error(error);
        });

        // លីងផ្ញើសារ Telegram ទៅកាន់ Admin
        const message = `ជំរាបសួរ! ខ្ញុំបានទូទាត់ប្រាក់រួចរាល់ហើយ៖%0A- Player ID: ${playerId}%0A- ចំនួនពេជ្រ: ${selectedDiamond}%0A- តម្លៃ: $${selectedPrice}`;
        document.getElementById('telegramBtn').href = `https://t.me/${TELEGRAM_USERNAME}?text=${message}`;

        document.getElementById('qrModal').style.display = 'flex';

        // ចាប់ផ្តើមរត់ប្រព័ន្ធស្វែងរកការបង់ប្រាក់ (Polling/Auto-Check)
        startCheckingPayment(playerId);
    }

    function startCheckingPayment(playerId) {
        let attempts = 0;
        document.getElementById('paymentStatus').innerText = "⏳ កំពុងរង់ចាំការស្កេនទូទាត់...";
        document.getElementById('paymentStatus').style.color = "#0284c7";

        // Check ស្ថានភាពរៀងរាល់ ៥ វិនាទីម្តង
        checkInterval = setInterval(() => {
            attempts++;
            
            /* 
              នៅពេលអ្នកភ្ជាប់ជាមួយ Bakong Open API Backend 
              អ្នកអាចហៅ API មកពិនិត្យទីនេះបាន។ 
            */

            if (attempts > 36) { // ឈប់ Check ក្រោយរង់ចាំ 3 នាទី
                clearInterval(checkInterval);
                document.getElementById('paymentStatus').innerText = "⚠️ រយៈពេលទូទាត់បានផុតកំណត់! សូមព្យាយាមម្តងទៀត។";
                document.getElementById('paymentStatus').style.color = "#dc2626";
            }
        }, 5000);
    }

    function closeModal() {
        clearInterval(checkInterval);
        document.getElementById('qrModal').style.display = 'none';
    }
</script>

</body>
</html>
