<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhmerSMM - Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background-color: #f4f7f6; font-family: sans-serif; padding: 15px 10px; }
        .app-container { max-width: 800px; margin: 10px auto; background: #fff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); padding: 25px; }
        
        .khqr-card { max-width: 360px; margin: 20px auto; background: #ffffff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); overflow: hidden; border: 1px solid #e0e0e0; text-align: center; }
        .khqr-header { background: #e61b23; color: white; padding: 14px; font-weight: bold; font-size: 20px; letter-spacing: 1px; }
        .khqr-body { padding: 20px; }
        .khqr-img-wrapper { background: #ffffff; padding: 12px; border-radius: 16px; display: inline-block; border: 2px dashed #e61b23; margin: 10px 0; }
        .khqr-img { width: 260px; height: 260px; object-fit: contain; display: block; }
        .khqr-amount { font-size: 28px; font-weight: 800; color: #111; margin-top: 5px; }
        .khqr-merchant { font-size: 15px; font-weight: 700; color: #444; }

        .chat-box { height: 320px; overflow-y: auto; border: 1px solid #e9ecef; border-radius: 10px; padding: 15px; background: #f8f9fa; }
        .chat-msg { margin-bottom: 12px; max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; }
        .msg-self { background: #0d6efd; color: #fff; margin-left: auto; text-align: right; }
        .msg-other { background: #e9ecef; color: #333; margin-right: auto; }
        .chat-img, .chat-video { max-width: 220px; border-radius: 8px; margin-top: 5px; display: block; }
        .custom-input { background-color: #f1f3f5 !important; border: 1px solid #e9ecef !important; border-radius: 10px !important; padding: 10px 14px !important; }
    </style>
</head>
<body>

    <!-- Auth Section -->
    <div id="auth-section" class="app-container">
        <h3 class="text-center fw-bold text-primary mb-4"><i class="fa-solid fa-rocket me-2"></i>KhmerSMM Panel</h3>
        <ul class="nav nav-pills nav-justified mb-4">
            <li class="nav-item"><button class="nav-link active" id="btn-tab-login" onclick="switchForm('login')">Sign In</button></li>
            <li class="nav-item"><button class="nav-link" id="btn-tab-reg" onclick="switchForm('register')">Sign Up</button></li>
        </ul>

        <div id="login-form">
            <div class="mb-3"><label class="fw-bold">Email</label><input type="text" id="login-email" class="form-control custom-input" placeholder="ឧទាហរណ៍: user@gmail.com"></div>
            <div class="mb-3"><label class="fw-bold">Password</label><input type="password" id="login-pass" class="form-control custom-input"></div>
            <button class="btn btn-primary w-100 fw-bold py-2" onclick="handleLogin()">Sign In</button>
        </div>

        <div id="register-form" style="display: none;">
            <div class="mb-3"><label class="fw-bold">Email</label><input type="email" id="reg-email" class="form-control custom-input" placeholder="ឧទាហរណ៍: user@gmail.com"></div>
            <div class="mb-3"><label class="fw-bold">Password</label><input type="password" id="reg-pass" class="form-control custom-input"></div>
            <button class="btn btn-primary w-100 fw-bold py-2" onclick="handleRegister()">Sign Up</button>
        </div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard-section" class="app-container" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <div>
                <h5 class="fw-bold m-0" id="welcomeUser">Welcome</h5>
                <small class="text-muted">Balance: <strong class="text-success" id="userBalance">$0.00</strong></small>
            </div>
            <button class="btn btn-sm btn-outline-danger" onclick="location.reload()">Logout</button>
        </div>

        <!-- KHQR Deposit Card -->
        <div class="card p-3 mb-4 shadow-sm border-0">
            <h6 class="fw-bold text-danger mb-1"><i class="fa-solid fa-qrcode me-2"></i>KHQR Deposit ($0.50 - $100,000)</h6>
            <small class="text-muted mb-2 d-block">បញ្ចូលចំនួនទឹកប្រាក់ដែលចង់ទូទាត់</small>
            <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="number" id="depositAmount" class="form-control" placeholder="0.50" min="0.50" max="100000" step="0.01" value="1.00">
                <button class="btn btn-danger fw-bold" onclick="generateKHQR()"><i class="fa-solid fa-qrcode me-1"></i> បង្កើត QR Code</button>
            </div>
            
            <div id="khqrDisplayContainer" style="display: none;">
                <div class="khqr-card">
                    <div class="khqr-header"><i class="fa-solid fa-qrcode me-2"></i>KHQR</div>
                    <div class="khqr-body">
                        <div class="khqr-merchant" id="merchantName">SAMNANG MON</div>
                        <div class="khqr-amount" id="displayAmount">$0.00</div>
                        <div class="khqr-img-wrapper"><img id="khqrImage" src="" alt="KHQR Code" class="khqr-img"></div>
                        <small class="text-muted d-block">ស្កេនជាមួយ Bakong App ឬ Mobile Banking ណាមួយក៏បាន</small>
                        <small class="text-danger fw-bold mt-1 d-block"><i class="fa-regular fa-clock me-1"></i>មានប្រសិទ្ធភាពរយៈពេល ១០ នាទី</small>
                    </div>
                </div>
            </div>
        </div>

        <!-- Live Chat Card -->
        <div class="card p-3 shadow-sm border-0 mb-4">
            <h6 class="fw-bold text-primary mb-3"><i class="fa-solid fa-comments me-2"></i>Live Support Chat</h6>
            <div class="chat-box mb-3" id="chatBox"></div>
            <div class="input-group">
                <input type="file" id="mediaInput" class="d-none" accept="image/*,video/*" onchange="uploadAndSendMedia()">
                <button class="btn btn-outline-secondary" title="ផ្ញើរូបភាព/វីដេអូ" onclick="document.getElementById('mediaInput').click()">
                    <i class="fa-solid fa-paperclip"></i>
                </button>
                <input type="text" id="chatText" class="form-control" placeholder="សរសេរសារនៅទីនេះ..." onkeypress="if(event.key==='Enter') sendTextMessage()">
                <button class="btn btn-primary fw-bold" onclick="sendTextMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

<script>
    const socket = io();
    let currentUser = null;

    function switchForm(type) {
        document.getElementById('login-form').style.display = type === 'login' ? 'block' : 'none';
        document.getElementById('register-form').style.display = type === 'register' ? 'block' : 'none';
        document.getElementById('btn-tab-login').classList.toggle('active', type === 'login');
        document.getElementById('btn-tab-reg').classList.toggle('active', type === 'register');
    }

    async function handleRegister() {
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-pass').value;

        const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        alert(data.message);
        if (data.success) switchForm('login');
    }

    async function handleLogin() {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-pass').value;

        const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
        const data = await res.json();
        if (data.success) {
            currentUser = data.user;
            document.getElementById('welcomeUser').innerText = `Welcome, ${currentUser.username}`;
            document.getElementById('userBalance').innerText = `$${currentUser.balance.toFixed(2)}`;
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'block';
            socket.emit('join_chat', currentUser);
        } else { alert(data.message); }
    }

    async function generateKHQR() {
        const amount = parseFloat(document.getElementById('depositAmount').value);
        if (isNaN(amount) || amount < 0.50 || amount > 100000) {
            return alert('សូមបញ្ចូលចំនួនទឹកប្រាក់ចាប់ពី $0.50 ដល់ $100,000.00!');
        }

        const res = await fetch('/generate-qr', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount: amount, service: 'Add Funds' })
        });
        const data = await res.json();

        if (data.success) {
            document.getElementById('merchantName').innerText = data.merchantName;
            document.getElementById('displayAmount').innerText = `$${data.amount}`;
            document.getElementById('khqrImage').src = data.qrImage;
            document.getElementById('khqrDisplayContainer').style.display = 'block';
        } else { alert(data.message); }
    }

    function sendTextMessage() {
        const text = document.getElementById('chatText').value.trim();
        if (!text) return;
        socket.emit('send_message', { sender: currentUser.username, type: 'text', content: text });
        document.getElementById('chatText').value = '';
    }

    async function uploadAndSendMedia() {
        const file = document.getElementById('mediaInput').files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('mediaFile', file);

        const res = await fetch('/api/upload-media', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.success) {
            const type = data.isVideo ? 'video' : 'image';
            socket.emit('send_message', { sender: currentUser.username, type, content: data.url });
        }
    }

    socket.on('receive_message', (data) => {
        const chatBox = document.getElementById('chatBox');
        const isSelf = data.sender === currentUser.username;
        let contentHtml = '';

        if (data.type === 'text') contentHtml = `<div>${data.content}</div>`;
        else if (data.type === 'image') contentHtml = `<img src="${data.content}" class="chat-img">`;
        else if (data.type === 'video') contentHtml = `<video src="${data.content}" controls class="chat-video"></video>`;

        chatBox.innerHTML += `
            <div class="chat-msg ${isSelf ? 'msg-self' : 'msg-other'}">
                <small class="fw-bold d-block mb-1">${data.sender}</small>
                ${contentHtml}
            </div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    });
</script>
</body>
</html>
