<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KhmerSMM - Portal & Services</title>
  <!-- Google Sign-In SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    .card {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      text-align: center;
    }
    h2, h3 { color: #333; margin-top: 0; }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #ddd;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background: #0369a1; }
    .user-info { display: none; text-align: left; }
    .profile-img { width: 70px; height: 70px; border-radius: 50%; margin-bottom: 10px; }
    .divider { margin: 15px 0; color: #888; font-size: 14px; }
    .service-box { text-align: left; background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #eee; margin-top: 15px; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Login / Signup Form Card -->
    <div class="card" id="authCard">
      <h2>KhmerSMM Login</h2>
      <div id="authForm">
        <input type="text" id="username" placeholder="Username">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="handleSignUp()">Sign Up</button>
        
        <div class="divider">or</div>

        <!-- Google Sign-In Button -->
        <div id="g_id_onload"
             data-client_id="781995105719-0no5v9433h4ce49gatkua0gposrc3e51.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>

        <div class="g_id_signin"
             data-type="standard"
             data-size="large"
             data-theme="outline"
             data-text="continue_with"
             data-shape="rectangular"
             data-logo_alignment="left">
        </div>
      </div>

      <!-- ផ្នែកបង្ហាញ Profile ពេល Login ចូលរួច -->
      <div id="userInfo" class="user-info">
        <div style="display: flex; align-items: center; gap: 15px;">
          <img id="userImg" class="profile-img" src="https://via.placeholder.com/70" alt="Profile">
          <div>
            <h3 id="userName" style="margin:0;"></h3>
            <p id="userEmail" style="margin: 5px 0; color: #666;"></p>
            <p style="margin: 0;"><b>Balance:</b> $<span id="userBalance">0.00</span></p>
          </div>
        </div>
      </div>
    </div>

    <!-- ផ្នែកបង្ហាញបញ្ជីសេវាកម្មគ្រប់មុខ (Services Listing) -->
    <div class="card service-box" id="serviceSection">
      <h3>📋 បញ្ជីសេវាកម្មទាំងអស់ (All Services)</h3>
      
      <label><b>ជ្រើសរើសប្រភេទសេវាកម្ម (Category):</b></label>
      <select id="categorySelect" onchange="filterServices()">
        <option value="">-- ទាំងអស់ --</option>
      </select>

      <label style="margin-top: 10px; display: block;"><b>ជ្រើសរើសសេវាកម្មជាក់លាក់ (Service):</b></label>
      <select id="serviceSelect">
        <option value="">-- សូមជ្រើសរើស Category ជាមុន --</option>
      </select>

      <label style="margin-top: 10px; display: block;"><b>Link / URL:</b></label>
      <input type="text" id="orderLink" placeholder="https://t.me/... ឬ Link ផ្សេងៗ">

      <label style="margin-top: 10px; display: block;"><b>ចំនួន (Quantity):</b></label>
      <input type="number" id="orderQuantity" placeholder="1000">

      <button onclick="alert('✅ បញ្ជាទិញសេវាកម្មជោគជ័យ!')" style="background: #10b981;">ដាក់បញ្ជាទិញ (New Order)</button>
    </div>
  </div>

  <script>
    let allServicesData = [];

    async function handleSignUp() {
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!username || !email || !password) {
        alert('សូមបំពេញព័ត៌មានទាំងអស់!');
        return;
      }

      try {
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        if (data.success) {
          alert('🎉 ' + data.message);
          showUserSession(data.user.username, data.user.email, '', data.user.balance);
        } else {
          alert('❌ ' + data.message);
        }
      } catch (err) {
        alert('❌ មានបញ្ហាភ្ជាប់ទៅ Server!');
      }
    }

    async function handleCredentialResponse(response) {
      const data = parseJwt(response.credential);
      try {
        const res = await fetch('/api/google-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: data.email, name: data.name, googleId: data.sub })
        });
        const result = await res.json();
        if (result.success) {
          alert('🎉 Google Login ជោគជ័យ!');
          showUserSession(result.user.username, result.user.email, data.picture, result.user.balance);
        }
      } catch (err) {
        alert('❌ Google Login បរាជ័យ!');
      }
    }

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(decodeURIComponent(window.atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
    }

    function showUserSession(name, email, imgUrl, balance) {
      document.getElementById('authForm').style.display = 'none';
      document.getElementById('userName').innerText = name;
      document.getElementById('userEmail').innerText = email;
      document.getElementById('userBalance').innerText = balance.toFixed(2);
      if(imgUrl) document.getElementById('userImg').src = imgUrl;
      document.getElementById('userInfo').style.display = 'block';
      document.getElementById('serviceSection').style.display = 'block';
      
      // ពេល Login ចូលរួច ទាញយកបញ្ជីសេវាកម្មមកបង្ហាញស្វ័យប្រវត្តិ
      fetchServices();
    }

    // ទាញយក Services ពី Backend
    async function fetchServices() {
      try {
        const res = await fetch('/api/services');
        const services = await res.json();
        allServicesData = services;

        const categorySelect = document.getElementById('categorySelect');
        const categories = [...new Set(services.map(s => s.category))];

        categorySelect.innerHTML = '<option value="">-- ជ្រើសរើស Category ទាំងអស់ --</option>';
        categories.forEach(cat => {
          categorySelect.innerHTML += `<option value="${cat}">${cat}</option>`;
        });
      } catch (err) {
        console.error('Failed to load services');
      }
    }

    // Filter Services តាម Category ដែលបានជ្រើសរើស
    function filterServices() {
      const selectedCat = document.getElementById('categorySelect').value;
      const serviceSelect = document.getElementById('serviceSelect');

      serviceSelect.innerHTML = '<option value="">-- ជ្រើសរើសសេវាកម្ម --</option>';

      const filtered = selectedCat ? allServicesData.filter(s => s.category === selectedCat) : allServicesData;

      filtered.forEach(s => {
        serviceSelect.innerHTML += `<option value="${s.service}">[ID: ${s.service}] ${s.name} - Rate: $${s.rate}</option>`;
      });
    }
  </script>

</body>
</html>
