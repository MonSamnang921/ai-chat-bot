<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUTH STORE - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kantumruy Pro', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 24px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; border-bottom: 1px solid #334155; padding-bottom: 16px; }
        .header h1 { font-size: 22px; font-weight: 900; color: #e11d48; }

        /* Dashboard Layout */
        .admin-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 1024px) { .admin-layout { grid-template-columns: 1fr; } }

        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .card h2 { font-size: 16px; font-weight: 800; margin-bottom: 14px; color: #38bdf8; display: flex; align-items: center; gap: 8px; }

        /* Stats */
        .online-tag { background: #ecfdf5; color: #059669; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; }
        .online-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; }

        /* Form */
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; outline: none; }
        .btn-submit { padding: 10px 20px; background: #e11d48; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 800; }

        /* 💬 Chat Box Admin */
        .chat-container { display: flex; height: 400px; border: 1px solid #334155; border-radius: 12px; overflow: hidden; background: #1e293b; }
        .chat-clients-list { width: 160px; background: #0f172a; border-right: 1px solid #334155; overflow-y: auto; }
        .chat-client-item { padding: 12px; font-size: 12px; font-weight: 700; cursor: pointer; border-bottom: 1px solid #1e293b; position: relative; }
        .chat-client-item:hover, .chat-client-item.active { background: #1e293b; color: #38bdf8; }
        .unread-dot { position: absolute; top: 12px; right: 12px; width: 8px; height: 8px; background-color: #e11d48; border-radius: 50%; }
        
        .chat-conversation { flex: 1; display: flex; flex-direction: column; }
        .admin-chat-msgs { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
        .admin-bubble { padding: 6px 10px; border-radius: 10px; max-width: 80%; }
        .admin-bubble.guest { align-self: flex-start; background: #334155; color: #fff; border-bottom-left-radius: 2px; }
        .admin-bubble.admin { align-self: flex-end; background: #e11d48; color: #fff; border-bottom-right-radius: 2px; }
        
        .admin-chat-input { display: flex; padding: 10px; background: #0f172a; border-top: 1px solid #334155; gap: 8px; }
        .admin-chat-input input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #fff; font-size: 13px; outline: none; }
        .admin-chat-input button { background-color: #e11d48; color: #fff; border: none; padding: 0 14px; border-radius: 6px; cursor: pointer; }

        /* Table */
        table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
        th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid #334155; }
        th { color: #94a3b8; }
        .btn-table { padding: 5px 10px; background: #0284c7; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 11px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>YUTH STORE - Admin</h1>
            <div class="online-tag">
                <div class="online-dot"></div>
                <span id="onlineCount">0</span> Online
            </div>
        </div>

        <div class="admin-layout">
            <!-- 🏷️ Discount Control -->
            <div class="card">
                <h2><i class="fa-solid fa-tags"></i> ភាគរយបញ្ចុះតម្លៃទូទាំងវេបសាយ (%)</h2>
                <div class="form-group">
                    <label>កំណត់ភាគរយបញ្ចុះតម្លៃ (ឧទាហរណ៍: 10)</label>
                    <input type="number" id="discountInput" class="form-control" placeholder="0" min="0" max="90">
                </div>
                <button class="btn-submit" onclick="setDiscount()">រក្សាទុក %</button>
            </div>

            <!-- 💬 ផ្ទាំងជជែកជាមួយភ្ញៀវ -->
            <div class="card">
                <h2><i class="fa-solid fa-comments"></i> Live Chat Support</h2>
                <div class="chat-container">
                    <div class="chat-clients-list" id="chatClientsList">
                        <div style="padding:15px; color:#64748b; font-size:11px;">គ្មានការសន្ទនា...</div>
                    </div>
                    <div class="chat-conversation">
                        <div class="admin-chat-msgs" id="adminChatMessagesBox">
                            <div style="text-align:center; color:#64748b; margin-top:100px;">សូមជ្រើសរើសភ្ញៀវសិន។</div>
                        </div>
                        <div class="admin-chat-input">
                            <input type="text" id="adminMsgInput" placeholder="ឆ្លើយតប..." onkeypress="if(event.key==='Enter') sendAdminReply()">
                            <button onclick="sendAdminReply()"><i class="fa-solid fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 👥 User Management -->
        <div class="card">
            <h2><i class="fa-solid fa-users"></i> គ្រប់គ្រងកាបូបលុយភ្ញៀវ</h2>
            <table>
                <thead><tr><th>Email</th><th>ឈ្មោះ</th><th>លុយWallet</th><th>សកម្មភាព</th></tr></thead>
                <tbody id="userListBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // *** ជំនួស config ខាងក្រោមជាមួយ config Firebase របស់អ្នក ***
        const firebaseConfig = YOUR_FIREBASE_CONFIG;
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 🟢 រាប់ចំនួនអ្នក Online (Presence ត្រូវការព័ត៌មានបន្ថែមខាង Client ដើម្បីដើរ ត្រង់នេះគ្រាន់តែបង្ហាញជា Demo)
        // db.collection('online_presence').onSnapshot(snap => document.getElementById('onlineCount').innerText = snap.size);

        // 🏷️ Discount Control
        db.collection('settings').doc('discount').onSnapshot((doc) => {
            if (doc.exists) document.getElementById('discountInput').value = doc.data().percent || 0;
        });

        async function setDiscount() {
            const percent = parseInt(document.getElementById('discountInput').value) || 0;
            if (percent < 0 || percent > 90) { alert('ចន្លោះ 0-90%!'); return; }
            await db.collection('settings').doc('discount').set({ percent: percent });
            alert(`បានកំណត់ចុះតម្លៃ ${percent}% ជោគជ័យ!`);
        }

        // 👥 User Management
        db.collection('users').onSnapshot((snapshot) => {
            const tbody = document.getElementById('userListBody');
            tbody.innerHTML = '';
            snapshot.forEach((doc) => {
                const data = doc.data();
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${doc.id}</td>
                    <td>${data.name}</td>
                    <td style="color:#4ade80; font-weight:800;">$${(data.balance || 0).toFixed(2)}</td>
                    <td><button class="btn-table" onclick="adjustBalance('${doc.id}', ${data.balance || 0})"><i class="fa-solid fa-plus-minus"></i> កែប្រែលុយ</button></td>
                `;
                tbody.appendChild(tr);
            });
        });

        async function adjustBalance(email, currentBal) {
            const amountStr = prompt(`បញ្ចូលចំនួនលុយដើម្បីបូក/ដក សម្រាប់ (${email}) ៖\n(ឧទាហរណ៍៖ 5 ដើម្បីបូក, -5 ដើម្បីដក)`, '0');
            if (amountStr === null) return;
            const amount = parseFloat(amountStr);
            if (isNaN(amount) || amount === 0) return;
            await db.collection('users').doc(email).update({ balance: currentBal + amount });
            alert('បានកែសម្រួលលុយជោគជ័យ!');
        }

        // 💬 Live Chat Admin
        let activeSelectedChatId = null;
        let messagesListenUnsubscribe = null;

        // តាមដានបញ្ជីភ្ញៀវដែលឆាតមក
        db.collection('chats').orderBy('lastUpdated', 'desc').onSnapshot((snapshot) => {
            const list = document.getElementById('chatClientsList');
            list.innerHTML = '';
            if (snapshot.empty) {
                list.innerHTML = '<div style="padding:15px; color:#64748b; font-size:11px;">គ្មានការសន្ទនា...</div>';
                return;
            }
            snapshot.forEach((doc) => {
                const data = doc.data();
                const item = document.createElement('div');
                item.className = `chat-client-item ${activeSelectedChatId === doc.id ? 'active' : ''}`;
                item.innerHTML = `${data.clientName || 'Guest'} ${data.unread ? '<div class="unread-dot"></div>' : ''}`;
                item.onclick = () => selectChatClient(doc.id, data.clientName);
                list.appendChild(item);
            });
        });

        function selectChatClient(chatId, clientName) {
            activeSelectedChatId = chatId;
            
            // សំគាល់ថាបានអានហើយ
            db.collection('chats').doc(chatId).update({ unread: false });

            const box = document.getElementById('adminChatMessagesBox');
            box.innerHTML = '';
            
            if (messagesListenUnsubscribe) messagesListenUnsubscribe();

            messagesListenUnsubscribe = db.collection('chats').doc(chatId).collection('messages')
                .orderBy('timestamp', 'asc').onSnapshot((snapshot) => {
                    box.innerHTML = '';
                    snapshot.forEach((doc) => {
                        const msg = doc.data();
                        const bubble = document.createElement('div');
                        bubble.className = `admin-bubble ${msg.sender === 'admin' ? 'admin' : 'guest'}`;
                        bubble.innerText = msg.text;
                        box.appendChild(bubble);
                    });
                    box.scrollTop = box.scrollHeight;
                });
            document.getElementById('adminMsgInput').focus();
        }

        async function sendAdminReply() {
            const input = document.getElementById('adminMsgInput');
            const text = input.value.trim();
            if (!text || !activeSelectedChatId) return;

            await db.collection('chats').doc(activeSelectedChatId).collection('messages').add({
                text: text,
                sender: 'admin',
                senderName: 'Admin',
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            await db.collection('chats').doc(activeSelectedChatId).update({
                lastMessage: 'Admin: ' + text,
                lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
            });

            input.value = '';
        }
    </script>
</body>
</html>
