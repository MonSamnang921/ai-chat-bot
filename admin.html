<!-- ផ្នែក Admin Panel (សម្រាប់តែ Admin បញ្ចូលលុយឱ្យភ្ញៀវ) -->
<div id="adminSection" class="container" style="margin-top: 30px; border: 2px solid #f59e0b;">
    <h3 style="color: #f59e0b; text-align: center;"><i class="fa-solid fa-user-shield"></i> Admin Panel (បញ្ចូលលុយ)</h3>
    
    <div class="form-group">
        <label>១. អ៊ីមែលភ្ញៀវ (User Email):</label>
        <input type="text" id="adminUserEmail" placeholder="ឧទាហរណ៍: user@gmail.com">
    </div>

    <div class="form-group">
        <label>២. ចំនួនទឹកប្រាក់ត្រូវបញ្ចូល ($):</label>
        <input type="text" id="adminAddAmount" placeholder="ឧទាហរណ៍: 10.00">
    </div>

    <button class="btn" onclick="adminAddBalance()" style="background: #22c55e; color: #fff;">បញ្ចូលលុយឱ្យភ្ញៀវ</button>
</div>

<script>
    // សមតុល្យសាកល្បងរបស់អតិថិជន
    let userBalance = 0.00;

    function adminAddBalance() {
        const targetEmail = document.getElementById('adminUserEmail').value;
        const addAmount = parseFloat(document.getElementById('adminAddAmount').value);

        if (!targetEmail || isNaN(addAmount)) {
            alert('សូមបញ្ចូល Email និងចំនួនទឹកប្រាក់ឱ្យបានត្រឹមត្រូវ!');
            return;
        }

        // ប្រសិនបើបញ្ចូលត្រូវ Email អតិថិជនដែលកំពុង Login
        if (currentUser && currentUser.email === targetEmail) {
            userBalance += addAmount;
            alert(`បានបញ្ចូលទឹកប្រាក់ $${addAmount.toFixed(2)} ជូន ${targetEmail} រួចរាល់!`);
            
            // Update បង្ហាញលើអេក្រង់
            document.getElementById('displayUserBalance').innerText = `$${userBalance.toFixed(2)}`;
        } else {
            alert('រកមិនឃើញ Email អតិថិជននេះនៅលើប្រព័ន្ធឡើយ!');
        }
    }
</script>
