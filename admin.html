<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUTH STORE - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kantumruy Pro', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 24px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; border-bottom: 1px solid #334155; padding-bottom: 16px; }
        .admin-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 1024px) { .admin-layout { grid-template-columns: 1fr; } }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .form-control { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; outline: none; }
        .btn-submit { padding: 10px 20px; background: #e11d48; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 800; }
        .chat-container { display: flex; height: 400px; border: 1px solid #334155; border-radius: 12px; overflow: hidden; }
        .chat-clients-list { width: 160px; background: #0f172a; border-right: 1px solid #334155; overflow-y: auto; }
        .chat-client-item { padding: 12px; font-size: 12px; font-weight: 700; cursor: pointer; border-bottom: 1px solid #1e293b; }
        .chat-client-item.active { background: #1e293b; color: #38bdf8; }
        .chat-conversation { flex: 1; display: flex; flex-direction: column; }
        .admin-chat-msgs { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .admin-bubble { padding: 6px 10px; border-radius: 10px; max-width: 80%; }
        .admin-bubble.guest { align-self: flex-start; background: #334155; }
        .admin-bubble.admin { align-self: flex-end; background: #e11d48; }
        .admin-chat-input { display: flex; padding: 10px; background: #0f172a; border-top: 1px solid #334155; gap: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #334155; }
        .btn-table { padding: 5px 10px; background: #0284c7; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>YUTH STORE - Admin Management</h1><div>Online Client: <span id="onlineCount">1</span></div></div>
        <div class="admin-layout">
            <div class="card">
                <h2><i class="fa-solid fa-tags"></i> បញ្ចុះតម្លៃទូទាំងវេបសាយ (%)</h2>
                <input type="number" id="discountInput" class="form-control" placeholder="ភាគរយបញ្ចុះតម្លៃ" style="margin-bottom:12px;">
                <button class="btn-submit" onclick="setDiscount()">រក្សាទុក</button>
            </div>
            <div class="card">
                <h2><i class="fa-solid fa-comments"></i> Live Chat Panel</h2>
                <div class="chat-container">
                    <div class="chat-clients-list" id="chatClientsList"></div>
                    <div class="chat-conversation">
                        <div class="admin-chat-msgs" id="adminChatMessagesBox"></div>
                        <div class="admin-chat-input">
                            <input type="text" id="adminMsgInput" class="form-control" placeholder="ឆ្លើយតប..." onkeypress="if(event.key==='Enter') sendAdminReply()">
                            <button class="btn-submit" onclick="sendAdminReply()">ផ្ញើ</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card">
            <h2><i class="fa-solid fa-wallet"></i> គ្រប់គ្រងលុយកាបូបភ្ញៀវ</h2>
            <table>
                <thead><tr><th>Email</th><th>ឈ្មោះ</th><th>សមតុល្យ</th><th>សកម្មភាព</th></tr></thead>
                <tbody id="userListBody"></tbody>
            </table>
        </div>
    </div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDS3kWriQ5w4I7h00r0y_e3ZizMoVgt_Ys",
            authDomain: "planning-with-ai-46ea2.firebaseapp.com",
            projectId: "planning-with-ai-46ea2",
            storageBucket: "planning-with-ai-46ea2.firebasestorage.app",
            messagingSenderId: "631178903261",
            appId: "1:631178903261:web:0aa1ff1a68c633fdd0a534"
        };
        firebase.initializeApp(firebaseConfig); const db = firebase.firestore();
        let activeSelectedChatId = null; let messagesListenUnsubscribe = null;

        db.collection('online_presence').onSnapshot(snap => document.getElementById('onlineCount').innerText = snap.size || 1);
        db.collection('settings').doc('discount').onSnapshot(doc => { if (doc.exists) document.getElementById('discountInput').value = doc.data().percent || 0; });
        async function setDiscount() { let p = parseInt(document.getElementById('discountInput').value) || 0; await db.collection('settings').doc('discount').set({ percent: p }); alert('ជោគជ័យ!'); }

        db.collection('users').onSnapshot((snapshot) => {
            const tbody = document.getElementById('userListBody'); tbody.innerHTML = '';
            snapshot.forEach((doc) => {
                let d = doc.data();
                tbody.innerHTML += `<tr><td>${doc.id}</td><td>${d.name || 'User'}</td><td style="color:#4ade80;">$${(d.balance || 0).toFixed(2)}</td><td><button class="btn-table" onclick="adjustBalance('${doc.id}', ${d.balance || 0})">កែប្រែលុយ</button></td></tr>`;
            });
        });

        async function adjustBalance(email, currentBal) {
            let amt = parseFloat(prompt(`បញ្ចូលលុយបូក/ដក សម្រាប់ ${email}:`, '0'));
            if (!isNaN(amt) && amt !== 0) await db.collection('users').doc(email).update({ balance: currentBal + amt });
        }

        db.collection('chats').orderBy('lastUpdated', 'desc').onSnapshot((snapshot) => {
            const list = document.getElementById('chatClientsList'); list.innerHTML = '';
            snapshot.forEach((doc) => {
                let d = doc.data();
                let item = document.createElement('div'); item.className = `chat-client-item ${activeSelectedChatId === doc.id ? 'active' : ''}`;
                item.innerText = d.clientName || 'Guest'; item.onclick = () => selectChatClient(doc.id); list.appendChild(item);
            });
        });

        function selectChatClient(chatId) {
            activeSelectedChatId = chatId; if (messagesListenUnsubscribe) messagesListenUnsubscribe();
            messagesListenUnsubscribe = db.collection('chats').doc(chatId).collection('messages').orderBy('timestamp', 'asc').onSnapshot((snapshot) => {
                const box = document.getElementById('adminChatMessagesBox'); box.innerHTML = '';
                snapshot.forEach(doc => {
                    let m = doc.data(); box.innerHTML += `<div class="admin-bubble ${m.sender === 'admin' ? 'admin' : 'guest'}">${m.text}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        async function sendAdminReply() {
            const input = document.getElementById('adminMsgInput'); let text = input.value.trim(); if (!text || !activeSelectedChatId) return;
            await db.collection('chats').doc(activeSelectedChatId).collection('messages').add({ text: text, sender: 'admin', timestamp: firebase.firestore.FieldValue.serverTimestamp() });
            await db.collection('chats').doc(activeSelectedChatId).update({ lastMessage: 'Admin: ' + text, lastUpdated: firebase.firestore.FieldValue.serverTimestamp() });
            input.value = '';
        }
    </script>
</body>
</html>
