<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUTH STORE - Admin Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Kantumruy Pro', sans-serif, Arial; }
        body { background-color: #0f172a; color: #ffffff; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 450px; background: #1e293b; padding: 24px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #ef4444; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; }
        input[type="text"], input[type="password"], input[type="number"] {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 16px;
        }
        .btn { width: 100%; padding: 12px; background: #22c55e; color: #fff; font-weight: bold; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .btn-danger { background: #ef4444; margin-top: 10px; }
        .login-gate { text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2><i class="fa-solid fa-user-shield"></i> Admin Panel</h2>

    <div id="pinGate" class="login-gate">
        <p>សូមបញ្ចូល PIN សម្ងាត់ដើម្បីចូលកាន់ប្រព័ន្ធ Admin</p>
        <div class="form-group">
            <input type="password" id="adminPin" placeholder="បញ្ចូល PIN សម្ងាត់">
        </div>
        <button class="btn" onclick="checkPin()">ចូលប្រើប្រាស់</button>
    </div>

    <div id="adminControls" style="display: none;">
        <div class="form-group">
            <label>១. អ៊ីមែលអតិថិជន (User Email):</label>
            <input type="text" id="targetEmail" placeholder="ឧទាហរណ៍: customer@gmail.com">
        </div>

        <div class="form-group">
            <label>២. ចំនួនទឹកប្រាក់ ($):</label>
            <input type="number" id="addAmount" step="0.01" placeholder="ឧទាហរណ៍: 10.00">
        </div>

        <button class="btn" onclick="processBalance('add')">➕ បន្ថែមលុយឱ្យភ្ញៀវ</button>
        <button class="btn btn-danger" onclick="processBalance('deduct')">➖ កាត់លុយភ្ញៀវ</button>
    </div>
</div>

<script>
    // 🔴 Firebase Config ពិតប្រាកដរបស់អ្នក
    const firebaseConfig = {
      apiKey: "AIzaSyDS3kWriQ5w4I7h00r0y_e3ZizMoVgt_Ys",
      authDomain: "planning-with-ai-46ea2.firebaseapp.com",
      projectId: "planning-with-ai-46ea2",
      storageBucket: "planning-with-ai-46ea2.firebasestorage.app",
      messagingSenderId: "631178903261",
      appId: "1:631178903261:web:0aa1ff1a68c633fdd0a534"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const ADMIN_PIN = "232344";

    function checkPin() {
        const inputPin = document.getElementById('adminPin').value;
        if (inputPin === ADMIN_PIN) {
            document.getElementById('pinGate').style.display = 'none';
            document.getElementById('adminControls').style.display = 'block';
        } else {
            alert('PIN សម្ងាត់មិនត្រឹមត្រូវឡើយ!');
        }
    }

    async function processBalance(action) {
        const email = document.getElementById('targetEmail').value.trim().toLowerCase();
        const amount = parseFloat(document.getElementById('addAmount').value);

        if (!email || isNaN(amount) || amount <= 0) {
            alert('សូមបញ្ចូល Email និងចំនួនទឹកប្រាក់ឱ្យបានត្រឹមត្រូវ!');
            return;
        }

        const userRef = db.collection('users').doc(email);
        const doc = await userRef.get();

        let currentBal = 0.00;
        if (doc.exists) {
            currentBal = doc.data().balance || 0.00;
        }

        let newBal = currentBal;
        if (action === 'add') {
            newBal += amount;
        } else {
            newBal = Math.max(0, newBal - amount);
        }

        await userRef.set({ balance: newBal }, { merge: true });

        if (action === 'add') {
            alert(`បានបន្ថែមទឹកប្រាក់ $${amount.toFixed(2)} ជូន ${email} រួចរាល់! សមតុល្យថ្មីគឺ: $${newBal.toFixed(2)}`);
        } else {
            alert(`បានកាត់ទឹកប្រាក់ $${amount.toFixed(2)} ពី ${email} រួចរាល់! សមតុល្យថ្មីគឺ: $${newBal.toFixed(2)}`);
        }

        document.getElementById('targetEmail').value = '';
        document.getElementById('addAmount').value = '';
    }
</script>

</body>
</html>
